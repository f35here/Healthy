<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1E4D34" />
    <meta name="description" content="Healthy Mood — قائمة صحية" />
    <title>Healthy Mood | قائمة صحية</title>

    <link rel="icon" type="image/jpg" href="./logo/logo.jpg" />
    <link rel="apple-touch-icon" href="./logo/logo.jpg" />

    <!-- Iconify CDN -->
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet" />

    <style>
        /* ══════════════════════════════════════════════
           DESIGN SYSTEM
           ══════════════════════════════════════════════ */
        :root {
            --primary: #1E4D34;
            --primary-hover: #16382A;
            --primary-soft: #EBF2EE;
            --accent: #B8874A;
            --accent-soft: #F6EEE2;

            --ink: #1A1F1B;
            --ink-soft: #4A443E;
            --ink-muted: #7E8880;

            --bg: #FAF8F4;
            --surface: #FFFFFF;
            --surface-muted: #F2F1EA;

            --border: #E8E2D8;
            --border-strong: #D4CBBF;

            --error: #B43C3C;

            --r-xs: 4px;
            --r-sm: 8px;
            --r-md: 12px;
            --r-lg: 16px;
            --r-pill: 999px;

            --shadow-sm: 0 1px 3px rgba(26, 31, 27, 0.06), 0 1px 2px rgba(26, 31, 27, 0.04);
            --shadow-md: 0 4px 16px rgba(26, 31, 27, 0.08);
            --shadow-lg: 0 12px 32px rgba(26, 31, 27, 0.12);

            --t-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --t-base: 200ms cubic-bezier(0.4, 0, 0.2, 1);
            --t-slow: 320ms cubic-bezier(0.4, 0, 0.2, 1);

            --font-headline: 'Cairo', system-ui, sans-serif;
            --font-body: 'Cairo', system-ui, -apple-system, sans-serif;
            --font-mono: 'Space Grotesk', 'Cairo', sans-serif;

            --header-h: 68px;
            --gutter: 20px;
            --container-max: 1200px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
            font-size: 16px;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--ink);
            line-height: 1.5;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            display: flex;
            flex-direction: column;
        }

        button { font-family: inherit; cursor: pointer; border: none; background: none; font-size: inherit; }
        a { text-decoration: none; color: inherit; }
        img { max-width: 100%; display: block; }
        input { font-family: inherit; font-size: inherit; outline: none; border: none; }

        /* ── Custom scrollbar ── */
        * {
            scrollbar-width: thin;
            scrollbar-color: var(--border-strong) transparent;
        }
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: var(--r-pill);
            border: 2px solid var(--bg);
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }
        ::-webkit-scrollbar-corner { background: transparent; }

        .container {
            max-width: var(--container-max);
            margin: 0 auto;
            padding: 0 var(--gutter);
            width: 100%;
        }

        /* ══════════════════════════════════════════════
           HEADER
           ══════════════════════════════════════════════ */
        .header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(255, 255, 255, 0.94);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid var(--border);
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            min-height: var(--header-h);
            padding: 10px 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .brand img {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border);
            background: var(--surface-muted);
            flex-shrink: 0;
        }

        .brand-text {
            font-family: var(--font-headline);
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--primary);
            letter-spacing: -0.01em;
            line-height: 1.15;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .brand-text small {
            display: block;
            font-size: 0.68rem;
            font-weight: 400;
            color: var(--ink-muted);
            margin-top: 2px;
            letter-spacing: 0;
        }

        .cart-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 16px;
            border-radius: var(--r-pill);
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--ink-soft);
            background: var(--surface);
            border: 1px solid var(--border);
            transition: all var(--t-fast);
        }
        .cart-badge:hover {
            background: var(--surface-muted);
            border-color: var(--border-strong);
            color: var(--primary);
        }
        .cart-badge:active { transform: scale(0.97); }
        .cart-badge iconify-icon { font-size: 1.1rem; }

        .cart-count {
            background: var(--primary);
            color: #FFF;
            font-size: 0.7rem;
            font-weight: 600;
            min-width: 22px;
            height: 22px;
            padding: 0 5px;
            border-radius: var(--r-pill);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-mono);
            line-height: 1;
        }

        /* ══════════════════════════════════════════════
           HERO
           ══════════════════════════════════════════════ */
        .hero {
            position: relative;
            margin: 24px 0 32px;
            border-radius: var(--r-lg);
            overflow: hidden;
            box-shadow: var(--shadow-md);
            background: var(--primary);
            text-align: center;
            min-height: 380px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-bg {
            position: absolute;
            inset: 0;
            background-image: url('./logo/hero-desktop.webp');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            z-index: 1;
            transition: transform 12s ease-out;
        }

        .hero:hover .hero-bg { transform: scale(1.06); }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(30, 77, 52, 0.85) 0%, rgba(26, 31, 27, 0.75) 100%);
            z-index: 2;
        }

        .hero-content {
            position: relative;
            z-index: 3;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .hero .tagline {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.72rem;
            font-weight: 600;
            color: #FFFFFF;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 16px;
            padding: 6px 16px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: var(--r-pill);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .hero .tagline iconify-icon { font-size: 1rem; color: var(--accent); }

        .hero h1 {
            font-family: var(--font-headline);
            font-size: 2rem;
            font-weight: 700;
            color: #FFFFFF;
            line-height: 1.25;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
        }

        .hero p {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.9);
            max-width: 520px;
            margin: 0 auto;
            line-height: 1.6;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.4);
        }

        @media (min-width: 768px) {
            .hero { min-height: 420px; }
            .hero-content { padding: 80px 40px; }
            .hero h1 { font-size: 2.6rem; }
            .hero p { font-size: 1.05rem; }
        }

        @media (max-width: 767px) {
            .hero { margin: 16px 0 24px; min-height: 320px; border-radius: var(--r-md); }
            .hero-bg { background-position: center 30%; }
            .hero-content { padding: 40px 20px; }
            .hero h1 { font-size: 1.6rem; }
            .hero p { font-size: 0.85rem; }
        }

        /* ══════════════════════════════════════════════
           CATEGORY TABS
           ══════════════════════════════════════════════ */
        .tabs-wrap {
            position: relative;
            margin-bottom: 24px;
            mask-image: linear-gradient(to right, transparent, black 16px, black calc(100% - 16px), transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 16px, black calc(100% - 16px), transparent);
        }
        
        @media (min-width: 768px) {
            .tabs-wrap {
                mask-image: none;
                -webkit-mask-image: none;
            }
        }

        .category-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: nowrap;
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            padding: 4px 0;
            scroll-snap-type: x mandatory;
        }
        .category-tabs::-webkit-scrollbar { display: none; }

        @media (min-width: 768px) {
            .category-tabs {
                flex-wrap: wrap;
                justify-content: center;
                overflow-x: visible;
            }
        }

        .category-tab {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: var(--r-pill);
            font-size: 0.85rem;
            font-weight: 500;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--ink-soft);
            transition: all var(--t-fast);
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
            scroll-snap-align: start;
            flex-shrink: 0;
        }

        .category-tab iconify-icon { font-size: 1.1rem; color: var(--ink-muted); transition: color var(--t-fast); }
        .category-tab:hover { background: var(--surface-muted); border-color: var(--border-strong); color: var(--ink); }
        .category-tab:hover iconify-icon { color: var(--ink-soft); }

        .category-tab.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #FFFFFF;
            box-shadow: 0 4px 12px rgba(30, 77, 52, 0.2);
        }
        .category-tab.active iconify-icon { color: #FFFFFF; }

        .category-tab .count {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            opacity: 0.7;
            font-weight: 600;
            background: rgba(0,0,0,0.04);
            padding: 2px 6px;
            border-radius: 6px;
        }
        .category-tab.active .count { background: rgba(255,255,255,0.2); color: #FFF; opacity: 1; }

        /* ══════════════════════════════════════════════
           SECTION HEADER
           ══════════════════════════════════════════════ */
        .section-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .section-header h2 {
            font-family: var(--font-headline);
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--ink);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-header h2 iconify-icon { font-size: 1.3rem; color: var(--accent); }

        .section-header .sub {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--ink-muted);
            font-weight: 500;
        }

        /* ══════════════════════════════════════════════
           MENU GRID (Image-Less Professional Design with Iconify)
           ══════════════════════════════════════════════ */
        .main-content { flex: 1 0 auto; padding-bottom: 40px; }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            transition: opacity var(--t-base);
        }
        .menu-grid.fade-out { opacity: 0; pointer-events: none; }

        .menu-card {
            position: relative;
            background: var(--surface);
            border-radius: var(--r-lg);
            border: 1px solid var(--border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: border-color var(--t-slow), box-shadow var(--t-slow);
            padding: 20px;
        }

        @media (hover: hover) and (pointer: fine) {
            .menu-card:hover {
                border-color: var(--border-strong);
                box-shadow: var(--shadow-md);
            }
        }

        /* Huge Faint Background Icon (Watermark) */
        .card-bg-icon {
            position: absolute;
            left: -20px;
            bottom: -20px;
            font-size: 160px;
            color: var(--primary);
            opacity: 0.03;
            z-index: 0;
            pointer-events: none;
            transform: rotate(-10deg);
            transition: transform var(--t-slow);
        }
        @media (hover: hover) and (pointer: fine) {
            .menu-card:hover .card-bg-icon {
                transform: rotate(0deg) scale(1.05);
                opacity: 0.05;
            }
        }

        .menu-card-body {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 10px;
        }

        .card-icon-badge {
            width: 44px;
            height: 44px;
            border-radius: var(--r-sm);
            background: var(--primary-soft);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            flex-shrink: 0;
        }

        .menu-card-title {
            font-family: var(--font-headline);
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--ink);
            line-height: 1.35;
            flex: 1;
            margin-top: 2px;
        }

        .menu-card-desc {
            font-size: 0.8rem;
            color: var(--ink-muted);
            line-height: 1.6;
            margin-bottom: 16px;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .menu-card-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            font-size: 0.72rem;
            color: var(--ink-muted);
        }

        .menu-card-meta span {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: var(--surface-muted);
            padding: 4px 10px;
            border-radius: var(--r-pill);
        }

        .menu-card-meta iconify-icon { font-size: 0.9rem; }
        .menu-card-meta .cal iconify-icon { color: var(--accent); }
        .menu-card-meta .prot iconify-icon { color: var(--primary); }
        .menu-card-meta b { font-family: var(--font-mono); font-weight: 600; color: var(--ink-soft); }

        .menu-card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px dashed var(--border);
        }

        .menu-card-price {
            font-family: var(--font-mono);
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary);
            direction: ltr;
            unicode-bidi: plaintext;
            white-space: nowrap;
        }
        .menu-card-price small {
            font-size: 0.7em;
            font-weight: 500;
            color: var(--ink-muted);
            margin-left: 2px;
        }

        .add-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 38px;
            padding: 0 20px;
            border-radius: var(--r-pill);
            background: var(--primary);
            color: #FFFFFF;
            font-family: var(--font-headline);
            font-weight: 600;
            font-size: 0.82rem;
            transition: background var(--t-fast), transform var(--t-fast);
            white-space: nowrap;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(30, 77, 52, 0.2);
        }
        .add-btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .add-btn:active { transform: scale(0.98); }
        .add-btn iconify-icon { font-size: 1rem; }
        .add-btn.hide { display: none; }

        /* Stepper */
        .qty-stepper {
            display: none;
            align-items: center;
            height: 38px;
            border: 1px solid var(--border);
            border-radius: var(--r-pill);
            background: var(--surface);
            overflow: hidden;
            direction: ltr;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        .qty-stepper.show { display: inline-flex; }

        .qty-stepper .qty-btn {
            width: 38px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink-soft);
            font-size: 1rem;
            font-family: var(--font-mono);
            font-weight: 500;
            transition: background var(--t-fast), color var(--t-fast);
        }
        .qty-stepper .qty-btn:hover { background: var(--surface-muted); color: var(--primary); }
        .qty-stepper .qty-btn:active { background: var(--border); }

        .qty-stepper .qty-num {
            min-width: 34px;
            text-align: center;
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--ink);
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
            line-height: 36px;
            padding: 0 2px;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: var(--surface-muted);
            border-radius: var(--r-lg);
            border: 1px dashed var(--border-strong);
            color: var(--ink-muted);
        }
        .empty-state iconify-icon { font-size: 2.5rem; display: block; margin-bottom: 14px; color: var(--border-strong); }
        .empty-state p { font-size: 0.9rem; font-weight: 500; color: var(--ink-soft); }

        /* ══════════════════════════════════════════════
           CART MODAL
           ══════════════════════════════════════════════ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(26, 31, 27, 0.55);
            -webkit-backdrop-filter: blur(4px);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            animation: fadeIn var(--t-base);
        }
        .modal-overlay.open { display: flex; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .cart-modal {
            background: var(--surface);
            width: 100%;
            max-width: 520px;
            border-radius: var(--r-lg);
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
            animation: modalIn var(--t-base);
            overflow: hidden;
        }
        @keyframes modalIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        .cart-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            gap: 12px;
        }

        .cart-header h2 { display: flex; align-items: center; gap: 10px; font-size: 1.05rem; font-weight: 600; color: var(--ink); }
        .cart-header h2 iconify-icon { font-size: 1.2rem; color: var(--primary); }
        .cart-header .cart-badge-inline {
            background: var(--surface-muted);
            color: var(--ink-soft);
            font-family: var(--font-mono);
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: var(--r-pill);
            margin-inline-start: 4px;
        }

        .cart-close {
            width: 34px; height: 34px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: var(--ink-soft); font-size: 1.1rem;
            border: 1px solid var(--border); background: var(--surface);
            transition: background var(--t-fast), border-color var(--t-fast);
        }
        .cart-close:hover { background: var(--surface-muted); border-color: var(--border-strong); }

        .cart-body { flex: 1; overflow-y: auto; padding: 0 20px; }
        .cart-empty { text-align: center; padding: 48px 16px; color: var(--ink-muted); }
        .cart-empty iconify-icon { font-size: 2.5rem; color: var(--border-strong); display: block; margin-bottom: 14px; }
        .cart-empty p { font-size: 0.9rem; font-weight: 500; color: var(--ink-soft); }
        .cart-empty small { display: block; font-size: 0.78rem; margin-top: 4px; color: var(--ink-muted); }

        .cart-item { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--border); }
        .cart-item:last-child { border-bottom: none; }
        .cart-item-info { flex: 1; min-width: 0; }
        .cart-item-name { font-weight: 500; font-size: 0.9rem; color: var(--ink); line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .cart-item-price { font-family: var(--font-mono); font-size: 0.78rem; color: var(--ink-muted); margin-top: 2px; direction: ltr; unicode-bidi: plaintext; }

        .cart-qty-control {
            display: inline-flex; align-items: center;
            border: 1px solid var(--border); border-radius: var(--r-sm);

                                </div>
                                
                                <p class="menu-card-desc">${escapeHtml(item.description || 'وجبة لذيذة وصحية')}</p>
                                
                                <div class="menu-card-meta">
                                    <span class="cal"><iconify-icon icon="ph:fire"></iconify-icon> <b>${item.calories}</b> سعرة</span>
                                    <span class="prot"><iconify-icon icon="ph:barbell"></iconify-icon> <b>${item.protein}g</b> بروتين</span>
                                </div>
                                
                                <div class="menu-card-footer">
                                    <span class="menu-card-price">${formatPrice(item.price)} <small>${CONFIG.CURRENCY}</small></span>
                                    
                                    <button type="button" class="add-btn ${showStepper ? 'hide' : ''}" data-name="${escapeHtml(item.name)}" aria-label="إضافة ${escapeHtml(item.name)}">
                                        <iconify-icon icon="ph:plus"></iconify-icon>
                                        <span>أضف</span>
                                    </button>
                                    
                                    <div class="qty-stepper ${showStepper ? 'show' : ''}" data-name="${escapeHtml(item.name)}">
                                        <button type="button" class="qty-btn qty-minus" data-name="${escapeHtml(item.name)}" aria-label="تقليل">
                                            <iconify-icon icon="ph:minus"></iconify-icon>
                                        </button>
                                        <span class="qty-num">${qty}</span>
                                        <button type="button" class="qty-btn qty-plus" data-name="${escapeHtml(item.name)}" aria-label="زيادة">
                                            <iconify-icon icon="ph:plus"></iconify-icon>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </article>
                    `;
                }).join('');
            }

            function switchCategory(cat) {
                if (isTransitioning || cat === currentCategory) return;
                isTransitioning = true;
                currentCategory = cat;
                renderTabs();

                const grid = document.getElementById('menuGrid');
                grid.classList.add('fade-out');

                setTimeout(() => {
                    renderMenu();
                    grid.classList.remove('fade-out');
                    isTransitioning = false;
                }, 200);
            }

            function getCartTotal() {
                return Object.entries(cart).reduce((sum, [name, qty]) => {
                    const item = items.find(i => i.name === name);
                    return item ? sum + item.price * qty : sum;
                }, 0);
            }

            function getCartCount() { return Object.values(cart).reduce((a, b) => a + b, 0); }

            function changeQuantity(name, delta) {
                const item = items.find(i => i.name === name);
                if (!item) return;

                const newQty = Math.max(0, (cart[name] || 0) + delta);
                if (newQty === 0) delete cart[name];
                else cart[name] = newQty;

                Storage.save();
                updateCartUI();
                syncCard(name);
            }

            function syncCard(name) {
                const card = document.querySelector(`.menu-card[data-name="${CSS.escape(name)}"]`);
                if (!card) return;

                const qty = cart[name] || 0;
                const addBtn = card.querySelector('.add-btn');
                const stepper = card.querySelector('.qty-stepper');
                const qtyNum = card.querySelector('.qty-num');

                if (qty > 0) {
                    addBtn?.classList.add('hide');
                    stepper?.classList.add('show');
                    if (qtyNum) qtyNum.textContent = qty;
                } else {
                    addBtn?.classList.remove('hide');
                    stepper?.classList.remove('show');
                }
            }

            function updateCartUI() {
                const count = getCartCount();
                const total = getCartTotal();

                document.getElementById('cart-count').textContent = count;
                const itemsCount = document.getElementById('cartItemsCount');
                if (itemsCount) itemsCount.textContent = count;

                const totalEl = document.getElementById('cartTotal');
                if (totalEl) totalEl.innerHTML = `${formatPrice(total)} <small>${CONFIG.CURRENCY}</small>`;

                document.getElementById('checkoutBtn').disabled = count === 0;

                renderCartItems();
            }

            function renderCartItems() {
                const container = document.getElementById('cartItems');
                const entries = Object.entries(cart);

                if (!entries.length) {
                    container.innerHTML = `
                        <div class="cart-empty">
                            <iconify-icon icon="ph:tote-simple"></iconify-icon>
                            <p>سلة الطلبات فارغة</p>
                            <small>أضف بعض الوجبات اللذيذة!</small>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = entries.map(([name, qty]) => {
                    const item = items.find(i => i.name === name);
                    if (!item) return '';
                    return `
                        <div class="cart-item">
                            <div class="cart-item-info">
                                <div class="cart-item-name">${escapeHtml(name)}</div>
                                <div class="cart-item-price">${formatPrice(item.price)} ${CONFIG.CURRENCY} × ${qty}</div>
                            </div>
                            <div class="cart-qty-control">
                                <button type="button" data-name="${escapeHtml(name)}" data-action="decr" aria-label="تقليل">−</button>
                                <span class="cart-qty-num">${qty}</span>
                                <button type="button" data-name="${escapeHtml(name)}" data-action="incr" aria-label="زيادة">+</button>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            function openCart() {
                const overlay = document.getElementById('cartOverlay');
                overlay.classList.add('open');
                overlay.setAttribute('aria-hidden', 'false');
                document.body.style.overflow = 'hidden';
                updateCartUI();
            }

            function closeCart() {
                const overlay = document.getElementById('cartOverlay');
                overlay.classList.remove('open');
                overlay.setAttribute('aria-hidden', 'true');
                document.body.style.overflow = '';
            }

            function clearFieldError(id) {
                document.getElementById(id)?.classList.remove('input-error');
                document.getElementById('err-' + id)?.classList.remove('show');
            }

            function setFieldError(id, message) {
                document.getElementById(id)?.classList.add('input-error');
                const err = document.getElementById('err-' + id);
                if (err) {
                    if (message) err.textContent = message;
                    err.classList.add('show');
                }
            }

            function validateOrderForm() {
                const ids = ['customerName', 'customerPhone', 'customerAddress', 'deliveryTime'];
                ids.forEach(clearFieldError);

                let firstInvalid = null;
                const name = document.getElementById('customerName').value.trim();
                const phone = document.getElementById('customerPhone').value.trim();
                const address = document.getElementById('customerAddress').value.trim();
                const time = document.getElementById('deliveryTime').value.trim();

                if (!name) { setFieldError('customerName'); firstInvalid = firstInvalid || 'customerName'; }
                if (!address) { setFieldError('customerAddress'); firstInvalid = firstInvalid || 'customerAddress'; }
                if (!time) { setFieldError('deliveryTime'); firstInvalid = firstInvalid || 'deliveryTime'; }

                const phoneDigits = phone.replace(/\D/g, '');
                if (!phone || phoneDigits.length < 10) {
                    setFieldError('customerPhone');
                    firstInvalid = firstInvalid || 'customerPhone';
                }

                if (firstInvalid) {
                    document.getElementById(firstInvalid)?.focus();
                    showToast('من فضلك أكمل جميع البيانات المطلوبة');
                    return false;
                }
                return true;
            }

            function sendOrderWhatsApp() {
                const entries = Object.entries(cart);
                if (!entries.length) {
                    showToast('السلة فارغة! أضف بعض الوجبات أولاً');
                    return;
                }
                if (!validateOrderForm()) return;

                const name = document.getElementById('customerName').value.trim();
                const phone = document.getElementById('customerPhone').value.trim();
                const address = document.getElementById('customerAddress').value.trim();
                const time = document.getElementById('deliveryTime').value.trim();

                let total = 0;
                const orderLines = entries.map(([itemName, qty]) => {
                    const item = items.find(i => i.name === itemName);
                    if (!item) return '';
                    const sub = item.price * qty;
                    total += sub;
                    return `• ${itemName} × ${qty} = ${sub} ${CONFIG.CURRENCY}`;
                }).filter(Boolean);

                const lines = [
                    '*طلب جديد — Healthy Mood*',
                    '━━━━━━━━━━━━━━━━━━━━━',
                    `*الاسم:* ${name}`,
                    `*الجوال:* ${phone}`,
                    `*العنوان:* ${address}`,
                    `*الوقت المطلوب:* ${time}`,
                    '━━━━━━━━━━━━━━━━━━━━━',
                    '*تفاصيل الطلب:*',
                    ...orderLines,
                    '━━━━━━━━━━━━━━━━━━━━━',
                    `*الإجمالي:* ${total} ${CONFIG.CURRENCY}`,
                    '━━━━━━━━━━━━━━━━━━━━━',
                    'شكراً لثقتكم بـ Healthy Mood 💗'
                ];

                const whatsappUrl = `https://wa.me/${CONFIG.WHATSAPP_NUMBER}?text=${encodeURIComponent(lines.join('\n'))}`;

                const opened = window.open(whatsappUrl, '_blank');
                if (!opened) {
                    window.location.href = whatsappUrl;
                    return;
                }

                cart = {};
                Storage.save();
                updateCartUI();
                closeCart();
            }

            function bindEvents() {
                document.getElementById('categoryTabs').addEventListener('click', (e) => {
                    const tab = e.target.closest('.category-tab');
                    if (tab) switchCategory(tab.dataset.cat);
                });

                document.getElementById('menuGrid').addEventListener('click', (e) => {
                    const addBtn = e.target.closest('.add-btn');
                    if (addBtn) {
                        changeQuantity(addBtn.dataset.name, 1);
                        return;
                    }
                    const qtyBtn = e.target.closest('.qty-btn');
                    if (qtyBtn) {
                        const delta = qtyBtn.classList.contains('qty-plus') ? 1 : -1;
                        changeQuantity(qtyBtn.dataset.name, delta);
                    }
                });

                document.getElementById('cartItems').addEventListener('click', (e) => {
                    const btn = e.target.closest('button[data-action]');
                    if (!btn) return;
                    const delta = btn.dataset.action === 'incr' ? 1 : -1;
                    changeQuantity(btn.dataset.name, delta);
                });

                document.getElementById('cartToggleBtn').addEventListener('click', openCart);
                document.getElementById('cartCloseBtn').addEventListener('click', closeCart);
                document.getElementById('cartOverlay').addEventListener('click', (e) => {
                    if (e.target === e.currentTarget) closeCart();
                });

                document.getElementById('checkoutBtn').addEventListener('click', sendOrderWhatsApp);

                ['customerName', 'customerPhone', 'customerAddress', 'deliveryTime'].forEach(id => {
                    document.getElementById(id)?.addEventListener('input', () => clearFieldError(id));
                });

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        const overlay = document.getElementById('cartOverlay');
                        if (overlay.classList.contains('open')) closeCart();
                    }
                });
            }

            function init() {
                Storage.load();
                
                currentCategory = allCategories[0] || 'الكل';
                
                renderTabs();
                renderMenu();
                updateCartUI();
                bindEvents();
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
